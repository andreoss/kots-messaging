name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: ${{ matrix.module }} on Scala ${{ matrix.scala }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: [core, mem, stream, interop, bench]
        scala: ["2.13.18", "3.3.8"]
    steps:
      - uses: actions/checkout@v4
      - uses: coursier/cache-action@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Tests
        run: sbt -batch "++${{ matrix.scala }}" "${{ matrix.module }}/test"

  adapter:
    name: ${{ matrix.module }} against ${{ matrix.broker }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: kafka
            broker: Kafka
            services: kafka
          - module: amqp
            broker: RabbitMQ
            services: rabbitmq
          - module: sqs
            broker: an SQS-compatible service
            services: sqs
          - module: jms
            broker: ActiveMQ and Artemis
            services: activemq artemis
            artemis: true
          - module: prometheus
            broker: a composed Prometheus
            services: prometheus
    steps:
      - uses: actions/checkout@v4
      - uses: coursier/cache-action@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Start ${{ matrix.services }}
        run: docker compose up -d --wait ${{ matrix.services }}
      - name: Raise the Artemis disk guard
        if: matrix.artemis
        run: ./scripts/artemis-init.sh
      - name: Tests on Scala 2.13 and 3
        run: sbt -batch "+${{ matrix.module }}/test"
      - name: Broker logs on failure
        if: failure()
        run: docker compose logs --no-color ${{ matrix.services }}
      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans

  coverage:
    name: coverage gate on Scala 2.13
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: coursier/cache-action@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Start every broker
        run: docker compose up -d --wait
      - name: Raise the Artemis disk guard
        run: ./scripts/artemis-init.sh
      - name: Gate the modules the root aggregates
        run: >
          sbt -batch coverage "++2.13.18"
          core/test mem/test stream/test interop/test bench/test prometheus/test
          kafka/test amqp/test sqs/test jms/test
          coverageReport coverageAggregate
      - name: Gate the adapters
        run: >
          sbt -batch "++2.13.18"
          kafka/coverageReport amqp/coverageReport sqs/coverageReport
          jms/coverageReport prometheus/coverageReport
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scoverage-2.13
          path: |
            target/scala-2.13/scoverage-report/**
            modules/*/target/scala-2.13/scoverage-report/**
          if-no-files-found: ignore
      - name: Broker logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
